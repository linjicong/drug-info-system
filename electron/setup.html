<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>首次启动配置 - 药品信息系统</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        background: #f8fafc;
        color: #0f172a;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
      }
      .card {
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 28px;
        width: 100%;
        max-width: 560px;
        box-shadow: 0 4px 16px rgba(15, 23, 42, 0.06);
      }
      h1 {
        font-size: 18px;
        margin-bottom: 8px;
      }
      .desc {
        font-size: 13px;
        color: #64748b;
        line-height: 1.7;
        margin-bottom: 16px;
      }
      code {
        background: #f1f5f9;
        border-radius: 4px;
        padding: 1px 6px;
        font-size: 12px;
        color: #0f766e;
      }
      label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 6px;
      }
      textarea {
        width: 100%;
        min-height: 84px;
        resize: vertical;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 12px;
        font-family: Consolas, monospace;
        line-height: 1.6;
        outline: none;
      }
      textarea:focus {
        border-color: #0ea5e9;
        box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.15);
      }
      .error {
        color: #dc2626;
        font-size: 13px;
        margin-top: 10px;
        min-height: 18px;
      }
      button {
        margin-top: 12px;
        width: 100%;
        background: #0f172a;
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 10px 16px;
        font-size: 14px;
        cursor: pointer;
      }
      button:hover {
        background: #1e293b;
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>首次启动配置</h1>
      <p class="desc">
        本应用使用 TiDB Cloud Serverless 云端数据库（免费层可用）。
        请粘贴数据库连接串，格式形如
        <code>mysql://&lt;user&gt;:&lt;password&gt;@&lt;host&gt;:4000/&lt;dbname&gt;?ssl={"rejectUnauthorized":true}</code>。
        连接串仅保存在本机，之后启动无需再次配置。
      </p>
      <label for="db-url">TiDB 数据库连接串（DATABASE_URL）</label>
      <textarea id="db-url" placeholder="mysql://..." spellcheck="false"></textarea>
      <div class="error" id="error"></div>
      <button id="save">保存并启动</button>
    </div>
    <script>
      const input = document.getElementById('db-url');
      const button = document.getElementById('save');
      const errorBox = document.getElementById('error');

      button.addEventListener('click', async () => {
        errorBox.textContent = '';
        button.disabled = true;
        button.textContent = '保存中…';
        try {
          const result = await window.desktopApi.save(input.value);
          if (!result.ok) {
            errorBox.textContent = result.error || '保存失败';
            button.disabled = false;
            button.textContent = '保存并启动';
          }
          // 保存成功后主进程会自动关闭本窗口并继续启动流程
        } catch (error) {
          errorBox.textContent = String(error);
          button.disabled = false;
          button.textContent = '保存并启动';
        }
      });
    </script>
  </body>
</html>
