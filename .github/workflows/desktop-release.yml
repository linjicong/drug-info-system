name: Desktop Release

# 桌面版发版流水线：推送 v* 标签触发 → 构建 Electron 安装包 → 上传更新包到
# 七牛云（国内自动更新源）→ 同时挂一份到 GitHub Release 做备份。
#
# 发版步骤：
#   1. 修改 package.json 的 version（如 0.2.0）并提交
#   2. git tag v0.2.0 && git push origin v0.2.0
#   3. 用户侧：NSIS 安装版启动后自动检测更新；portable 版仅提示下载地址
#
# 需在仓库 Settings -> Secrets and variables -> Actions 配置：
#   QINIU_ACCESS_KEY / QINIU_SECRET_KEY     七牛密钥对（建议专用账号，仅授权目标桶读写）
#   QINIU_BUCKET                            存储空间名（需公开读，域名管理里绑定下载域名）
#   QINIU_ZONE                              存储区域，如 z0 / as0；可留空，脚本自动探测桶所在区域
#   UPDATE_URL                              更新源地址，须以 / 结尾，如
#                                           https://cdn.example.com/drug-info-system/releases/
#                                           （新桶无默认测试域名，需用已备案/绑定的访问域名）
#
# 注：构建不需要访问政府平台源站（无 CloudWAF 问题），用 GitHub 托管 runner 即可；
# 如需改走 self-hosted，把 runs-on 换成 [self-hosted, windows] 并保证环境装有 pnpm。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: desktop-release
  cancel-in-progress: false   # 发版构建不允许中途取消，避免七牛上传一半

env:
  # 桶内存放安装包的目录前缀（与 UPDATE_URL 的路径部分保持一致）
  RELEASE_PATH_PREFIX: drug-info-system/releases
  # LOCALAPPDATA 重定向到 runner.temp 下稳定路径：electron postinstall 下载、
  # desktop-build.mjs 查找、electron-builder 工具链缓存均读该环境变量，
  # 统一落位后 actions/cache 一次缓存（env 上下文不含 runner 系统变量，
  # path 中写 %LOCALAPPDATA% 不会被展开，故此处显式重定向）
  LOCALAPPDATA: '${{ runner.temp }}\localappdata'

jobs:
  build-and-publish:
    runs-on: windows-latest
    timeout-minutes: 60
    # 显式声明写入权限：创建/更新 GitHub Release 需要 contents: write，
    # 避免仓库默认只读 token 导致 action-gh-release 403
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Cache electron binaries & next build
        # 必须在 pnpm install 之前：electron 包 postinstall 会用 @electron/get
        # 下载发行包 zip 到 %LOCALAPPDATA%\electron\Cache，恢复晚了照样全量下载；
        # desktop-build.mjs 已内置「缓存 zip → 预解压」逻辑，命中后跳过网络下载。
        # key 用 lockfile hash：依赖或 Electron 版本变化时自动重建；restore-keys
        # 兜底：key 不匹配时仍复用旧缓存（版本未变的部分）
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}\localappdata
            .next/cache
          key: build-cache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            build-cache-${{ runner.os }}-

      - name: Install dependencies
        # node-linker=hoisted：平铺 node_modules。pnpm 默认 .pnpm 嵌套布局下
        # app-builder-lib 路径叠加后超 260 字符，NSIS makensis（不走长路径
        # API）无法 !include 模板文件；平铺布局路径短且无 junction，CI 上更稳
        run: pnpm install --frozen-lockfile --config.node-linker=hoisted

      - name: Check release secrets
        shell: pwsh
        env:
          QINIU_ACCESS_KEY: ${{ secrets.QINIU_ACCESS_KEY }}
          QINIU_SECRET_KEY: ${{ secrets.QINIU_SECRET_KEY }}
          QINIU_BUCKET: ${{ secrets.QINIU_BUCKET }}
          UPDATE_URL: ${{ secrets.UPDATE_URL }}
        run: |
          $missing = @()
          foreach ($name in @('QINIU_ACCESS_KEY', 'QINIU_SECRET_KEY', 'QINIU_BUCKET', 'UPDATE_URL')) {
            if (-not [Environment]::GetEnvironmentVariable($name)) { $missing += $name }
          }
          if ($missing.Count -gt 0) {
            Write-Error "缺少仓库 Secret：$($missing -join ', ')（见 workflow 文件头部说明）"
            exit 1
          }

      - name: Build desktop artifacts
        shell: pwsh
        env:
          UPDATE_URL: ${{ secrets.UPDATE_URL }}
        run: pnpm desktop:build

      - name: Verify artifacts
        shell: pwsh
        run: |
          $exe = Get-ChildItem release -Filter *.exe
          if (-not $exe) { Write-Error 'release/ 下未找到安装包'; exit 1 }
          if (-not (Test-Path release/latest.yml)) { Write-Error '缺少 release/latest.yml'; exit 1 }
          Get-ChildItem release | Format-Table Name, Length

      - name: Upload to Qiniu
        shell: pwsh
        env:
          QINIU_ACCESS_KEY: ${{ secrets.QINIU_ACCESS_KEY }}
          QINIU_SECRET_KEY: ${{ secrets.QINIU_SECRET_KEY }}
          QINIU_BUCKET: ${{ secrets.QINIU_BUCKET }}
          QINIU_ZONE: ${{ secrets.QINIU_ZONE }}
          UPDATE_URL: ${{ secrets.UPDATE_URL }}
        run: node scripts/upload-qiniu.mjs

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: false
          generate_release_notes: true
          files: |
            release/*.exe
            release/latest.yml
